<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حربatuan - لعبة حرب بسيطة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            overflow: hidden;
            direction: rtl;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #canvas {
            border: 4px solid #4a4a4a;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #228B22 60%, #228B22 100%);
            max-width: 100vw;
            max-height: 70vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }
        .stat-card {
            background: rgba(0,0,0,0.7);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 12px 20px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        .stat-card h3 {
            color: #00ff88;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
        }
        #controls-hint {
            position: absolute;
            top: 90px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #4a90e2;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            color: #a0c4ff;
            pointer-events: none;
            z-index: 10;
        }
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 20;
        }
        #direction-pad {
            display: flex;
            justify-content: space-between;
            width: 220px;
        }
        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #4a90e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #a0c4ff;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: all 0.1s;
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(74, 144, 226, 0.4);
            border-color: #00ff88;
            color: #00ff88;
            transform: scale(0.95);
        }
        #shoot-btn {
            width: 80px;
            height: 80px;
            background: rgba(255,68,68,0.15);
            border: 2px solid #ff4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #ff6666;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: all 0.1s;
            box-shadow: 0 0 20px rgba(255,68,68,0.3);
        }
        #shoot-btn:active, #shoot-btn.active {
            background: rgba(255,68,68,0.4);
            border-color: #ffffff;
            color: #ffffff;
            transform: scale(0.95);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92);
            border: 3px solid #ff4444;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 80%;
            max-width: 400px;
        }
        #game-over h2 {
            color: #ff4444;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        #game-over p {
            font-size: 1.4rem;
            margin-bottom: 30px;
        }
        #restart-btn {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255,68,68,0.5);
            transition: transform 0.2s;
        }
        #restart-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 480px) {
            #canvas { max-height: 60vh; }
            #direction-pad { width: 180px; }
            .touch-btn { width: 55px; height: 55px; font-size: 1.4rem; }
            #shoot-btn { width: 65px; height: 65px; font-size: 1.6rem; }
            .stat-card { padding: 8px 15px; }
            .stat-card .value { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="stat-card">
                <h3>الصحة</h3>
                <div id="player-hp" class="value">100</div>
            </div>
            <div class="stat-card">
                <h3>النقاط</h3>
                <div id="score" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>المستوى</h3>
                <div id="level" class="value">1</div>
            </div>
        </div>

        <canvas id="canvas" width="800" height="500"></canvas>

        <div id="controls-hint">
            🎮 الأسهم للتنقل • مسافة للإطلاق • استخدم الأزرار أدناه للشاشات اللمسية
        </div>

        <div id="touch-controls">
            <div id="direction-pad">
                <div class="touch-btn" id="btn-left" data-action="left">⬅</div>
                <div class="touch-btn" id="btn-right" data-action="right">➡</div>
            </div>
            <div id="shoot-btn" data-action="shoot">🚀 إطلاق</div>
        </div>

        <div id="game-over">
            <h2>انتهت اللعبة</h2>
            <p id="final-score">النقاط: 0</p>
            <button id="restart-btn">لعب مرة أخرى</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const playerHpEl = document.getElementById('player-hp');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const gameOverEl = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        const touchButtons = {
            left: document.getElementById('btn-left'),
            right: document.getElementById('btn-right'),
            shoot: document.getElementById('shoot-btn')
        };

        let gameActive = true;
        let score = 0;
        let level = 1;
        let playerHp = 100;
        let enemies = [];
        let bullets = [];
        let enemyBullets = [];
        let particles = [];
        let keys = {};
        let touchKeys = { left: false, right: false, shoot: false };
        let lastShot = 0;
        let lastEnemyShot = 0;
        let enemySpeed = 1.5;
        let spawnRate = 60;

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 80,
            w: 50,
            h: 40,
            speed: 5,
            color: '#00ff88',
            hp: 100,
            maxHp: 100
        };

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' && !gameActive) {
                restartGame();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function setupTouchButton(btnId, action) {
            const btn = document.getElementById(btnId);
            const activate = () => { touchKeys[action] = true; btn.classList.add('active'); };
            const deactivate = () => { touchKeys[action] = false; btn.classList.remove('active'); };

            btn.addEventListener('touchstart', e => { e.preventDefault(); activate(); });
            btn.addEventListener('touchend', e => { e.preventDefault(); deactivate(); });
            btn.addEventListener('touchcancel', e => { e.preventDefault(); deactivate(); });
            btn.addEventListener('mousedown', e => { e.preventDefault(); activate(); });
            btn.addEventListener('mouseup', e => { e.preventDefault(); deactivate(); });
            btn.addEventListener('mouseleave', e => deactivate());
        }

        setupTouchButton('btn-left', 'left');
        setupTouchButton('btn-right', 'right');
        setupTouchButton('shoot-btn', 'shoot');

        function restartGame() {
            gameActive = true;
            score = 0;
            level = 1;
            playerHp = 100;
            player.hp = 100;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            particles = [];
            touchKeys = { left: false, right: false, shoot: false };
            gameOverEl.style.display = 'none';
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        restartBtn.addEventListener('click', restartGame);
        restartBtn.addEventListener('touchstart', e => { e.preventDefault(); restartGame(); });

        function spawnEnemy() {
            const w = 40;
            const h = 30;
            const x = Math.random() * (canvas.width - w);
            const y = -h;
            enemies.push({
                x, y, w, h,
                speed: enemySpeed + Math.random() * 1,
                hp: 1 + Math.floor(level / 3),
                color: '#ff6666'
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30,
                    color
                });
            }
        }

        function shootBullet() {
            bullets.push({
                x: player.x + player.w / 2 - 2,
                y: player.y,
                w: 4,
                h: 15,
                speed: -8,
                color: '#00ffff'
            });
        }

        function update() {
            if (!gameActive) return;

            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.w) {
                player.x += player.speed;
            }
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowUp'] || keys['KeyW']) && player.y > 0) {
                player.y -= player.speed;
            }
            if ((keys['ArrowDown'] || keys['KeyS']) && player.y < canvas.height - player.h) {
                player.y += player.speed;
            }

            if (touchKeys.right && player.x < canvas.width - player.w) {
                player.x += player.speed;
            }
            if (touchKeys.left && player.x > 0) {
                player.x -= player.speed;
            }

            if (keys['Space'] && Date.now() - lastShot > 400) {
                shootBullet();
                lastShot = Date.now();
            }

            if (touchKeys.shoot && Date.now() - lastShot > 400) {
                shootBullet();
                lastShot = Date.now();
            }

            bullets.forEach((b, i) => {
                b.y += b.speed;
                if (b.y < 0) bullets.splice(i, 1);
            });

            enemyBullets.forEach((b, i) => {
                b.y += b.speed;
                if (b.y > canvas.height) enemyBullets.splice(i, 1);

                if (b.x < player.x + player.w &&
                    b.x + b.w > player.x &&
                    b.y < player.y + player.h &&
                    b.y + b.h > player.y) {
                    playerHp -= 15;
                    player.hp -= 15;
                    createExplosion(player.x + player.w/2, player.y + player.h/2, '#ff4444');
                    enemyBullets.splice(i, 1);
                    updateUI();
                    if (playerHp <= 0) gameOver();
                }
            });

            if (frameCount % spawnRate === 0) spawnEnemy();

            enemies.forEach((enemy, ei) => {
                enemy.y += enemy.speed;

                if (Date.now() - lastEnemyShot > 1500 && Math.random() < 0.02) {
                    enemyBullets.push({
                        x: enemy.x + enemy.w / 2 - 2,
                        y: enemy.y + enemy.h,
                        w: 4,
                        h: 15,
                        speed: 5,
                        color: '#ff4444'
                    });
                }

                if (enemy.x < player.x + player.w &&
                    enemy.x + enemy.w > player.x &&
                    enemy.y < player.y + player.h &&
                    enemy.y + enemy.h > player.y) {
                    playerHp -= 30;
                    player.hp -= 30;
                    createExplosion(enemy.x + enemy.w/2, enemy.y + enemy.h/2, '#ff4444');
                    enemies.splice(ei, 1);
                    updateUI();
                    if (playerHp <= 0) gameOver();
                    return;
                }

                if (enemy.y > canvas.height) {
                    enemies.splice(ei, 1);
                    playerHp -= 10;
                    player.hp -= 10;
                    updateUI();
                    if (playerHp <= 0) gameOver();
                }
            });

            bullets.forEach((b, bi) => {
                enemies.forEach((enemy, ei) => {
                    if (b.x < enemy.x + enemy.w &&
                        b.x + b.w > enemy.x &&
                        b.y < enemy.y + enemy.h &&
                        b.y + b.h > enemy.y) {
                        enemy.hp--;
                        bullets.splice(bi, 1);
                        createExplosion(enemy.x + enemy.w/2, enemy.y + enemy.h/2, '#ffff00');
                        if (enemy.hp <= 0) {
                            score += 100;
                            enemies.splice(ei, 1);
                            if (score % 500 === 0) {
                                level++;
                                enemySpeed += 0.5;
                                spawnRate = Math.max(20, spawnRate - 5);
                            }
                            updateUI();
                        }
                        return;
                    }
                });
            });

            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            });

            if (frameCount % 600 === 0) {
                enemySpeed += 0.2;
            }
        }

        let frameCount = 0;

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = '#00cc66';
            ctx.fillRect(player.x - 10, player.y + 10, player.w + 20, 10);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 15, player.y - 10, 20, 10);

            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.shadowBlur = 0;
            });

            enemyBullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
            });

            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                ctx.fillStyle = '#000';
                ctx.fillRect(enemy.x + 10, enemy.y + 8, 5, 5);
                ctx.fillRect(enemy.x + 25, enemy.y + 8, 5, 5);
                if (enemy.hp > 1) {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(enemy.x, enemy.y - 8, enemy.w, 5);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(enemy.x, enemy.y - 8, (enemy.w * enemy.hp) / 3, 5);
                }
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1;
            });

            frameCount++;
        }

        function gameLoop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }

        function updateUI() {
            playerHpEl.textContent = Math.max(0, playerHp);
            scoreEl.textContent = score;
            levelEl.textContent = level;
        }

        function gameOver() {
            gameActive = false;
            finalScoreEl.textContent = `النقاط النهائية: ${score}`;
            gameOverEl.style.display = 'block';
        }

        updateUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
